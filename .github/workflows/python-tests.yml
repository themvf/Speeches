name: Python Tests

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      # Workflow definitions are validated by tests/test_workflow_connectors_valid.py,
      # so run the suite whenever any workflow changes (not just this one).
      - ".github/workflows/**"
      - "apps/web/vercel.json"
      - "apps/web/lib/server/finra-member-firm-rss.ts"
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/**"
      - "apps/web/vercel.json"
      - "apps/web/lib/server/finra-member-firm-rss.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          set -euo pipefail
          python -m pytest tests/ -v --tb=short
