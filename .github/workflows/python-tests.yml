name: Python Tests

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      # Workflow definitions are validated by tests/test_workflow_connectors_valid.py,
      # so run the suite whenever any workflow changes (not just this one).
      - ".github/workflows/**"
      - "apps/web/vercel.json"
      - "apps/web/lib/server/finra-member-firm-rss.ts"
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/**"
      - "apps/web/vercel.json"
      - "apps/web/lib/server/finra-member-firm-rss.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: archive-test
          POSTGRES_DB: archive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CRYPTO_SOCIAL_TEST_DATABASE_URL: postgresql://postgres:archive-test@localhost:5432/archive_test
      # Fail rather than skip: a dead service must not report a green suite.
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest 'psycopg2-binary>=2.9,<3' 'requests>=2.31,<3' pyyaml
      - run: python -m pytest tests/test_launchpad_archive.py tests/test_launchpad_chains.py tests/test_launchpad_recovery.py tests/test_db_test_guard.py -v --tb=short
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          set -euo pipefail
          python -m pytest tests/ -v --tb=short
