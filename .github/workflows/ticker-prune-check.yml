name: Ticker Prune Check

# SEC-53 upkeep: weekly check for Industries-universe tickers that are no
# longer public (acquired/merged/taken private, deregistered, or renamed).
# Check-only - never edits UNIVERSE in build_industry_config.py directly.
# Flags candidates into a committed data/ticker_prune_review.json (git-as-store
# review artifact, same pattern as the KPI Tier C review queue) and opens a
# GitHub issue only when there's something to look at, so a clean week stays
# silent. Acting on a flagged row (removing or renaming a ticker in UNIVERSE)
# stays a manual edit + rerun of build_industry_config.py - a human call, on
# purpose, for the one part of this that's a real judgment case.

on:
  schedule:
    - cron: "20 11 * * 1"   # Monday, off-peak relative to the hourly/3-hourly jobs
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ticker-prune-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run check
        run: |
          set -euo pipefail
          python check_stale_tickers.py

      - name: Commit review file
        run: |
          set -euo pipefail
          git config user.name "ticker-prune-check[bot]"
          git config user.email "actions@github.com"
          git add data/ticker_prune_review.json
          if git diff --cached --quiet; then
            echo "nothing to commit (no change from last check)"; exit 0
          fi
          git commit -m "Ticker prune check: weekly Industries-universe scan (SEC-53)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build issue summary
        id: summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          with open("data/ticker_prune_review.json", encoding="utf-8") as f:
              review = json.load(f)
          candidates = review["candidates"]
          gh_out = os.environ["GITHUB_OUTPUT"]
          if not candidates:
              with open(gh_out, "a", encoding="utf-8") as f:
                  f.write("has_candidates=false\n")
              raise SystemExit(0)
          lines = [
              f"Checked {review['checkedCount']} tickers, flagged {review['flaggedCount']}.",
              "",
              "| Ticker | Reason | Confidence | Suggested action | Evidence |",
              "|---|---|---|---|---|",
          ]
          for c in sorted(candidates, key=lambda c: (c["confidence"] != "high", c["ticker"])):
              action = f"rename to {c['suggestedNewTicker']}" if c.get("suggestedNewTicker") else (
                  "remove from UNIVERSE" if c["reason"] in ("deregistered", "cik_not_found") else "review manually"
              )
              yahoo = "" if "yahooQuoteAlive" not in c else (" (Yahoo quote dead too)" if not c["yahooQuoteAlive"] else "")
              lines.append(f"| {c['ticker']} | {c['reason']} | {c['confidence']} | {action} | {c['evidence']}{yahoo} |")
          lines.append("")
          lines.append("Full detail in `data/ticker_prune_review.json`. Acting on a row means hand-editing "
                        "`UNIVERSE` in `build_industry_config.py` (remove, or swap to the suggested ticker for "
                        "renames), then rerunning `python build_industry_config.py` and committing the refreshed "
                        "`industry-config.json`.")
          with open("ticker_prune_body.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          with open(gh_out, "a", encoding="utf-8") as f:
              f.write("has_candidates=true\n")
          PY

      - name: Open GitHub issue
        if: steps.summary.outputs.has_candidates == 'true'
        run: |
          gh issue create \
            --title "Ticker prune check: $(python3 -c "import json; print(json.load(open('data/ticker_prune_review.json'))['flaggedCount'])") candidate(s) flagged" \
            --body-file ticker_prune_body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
