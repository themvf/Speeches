name: Crypto sentiment pilot
on:
  push:
    branches: [main]
    paths: ['crypto_sentiment_pilot.py', '.github/workflows/crypto-sentiment-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crypto-sentiment-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'psycopg2-binary>=2.9,<3' 'requests>=2.31,<3'
      - run: python crypto_sentiment_pilot.py
