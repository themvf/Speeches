name: Crypto Social Pilot Tests
on:
  pull_request:
    paths:
      - 'crypto_social*.py'
      - 'crypto_market_history.py'
      - 'crypto_event_study.py'
      - 'tests/test_crypto_event_study.py'
      - 'apps/web/lib/crypto-impact*'
      - 'apps/web/lib/crypto-coins*'
      - 'apps/web/lib/crypto-leaders*'
      - 'apps/web/lib/crypto-signals*'
      - 'apps/web/lib/crypto-workspace*'
      - 'apps/web/lib/server/crypto-account*'
      - 'crypto_coins.py'
      - 'crypto_rankings_cache.py'
      - 'scripts/crypto-rankings.mts'
      - 'tests/test_crypto_rankings_cache.py'
      - 'apps/web/lib/server/crypto-ranking*'
      - 'tests/test_crypto_coins.py'
      - 'tests/fixtures/crypto-coin-matches.json'
      - 'sql/crypto_market_history.sql'
      - 'tests/test_crypto_market_history.py'
      - 'crypto_hour_profile.py'
      - 'tests/test_crypto_hour_profile.py'
      - 'apps/web/lib/crypto-hour-profile*'
      - 'apps/web/lib/server/crypto-hour-profile.json'
      - 'apps/web/components/market/crypto-data-view.tsx'
      - '.github/workflows/crypto-market-history.yml'
      - '.github/workflows/crypto-hour-profile.yml'
      - 'sql/crypto_social*.sql'
      - 'tests/test_crypto_social*.py'
      - 'intelligence_fusion.py'
      - 'sql/intelligence_fusion.sql'
      - 'tests/test_intelligence_fusion.py'
      - '.github/workflows/crypto-social*.yml'
      - 'apps/web/lib/crypto-social*'
      - 'apps/web/lib/intelligence-fusion*'
      - 'apps/web/lib/server/intelligence-fusion*'
      - 'apps/web/lib/crypto-run*'
      - 'apps/web/lib/crypto-coin-discovery*'
      - 'apps/web/lib/crypto-voices*'
      - 'crypto_voice_research.py'
      - 'scripts/crypto-voice-snapshot.mts'
      - 'apps/web/lib/server/crypto-run*'
      - 'apps/web/components/market/crypto*'
      - 'apps/web/app/api/market/crypto/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: crypto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest 'psycopg2-binary>=2.9,<3' 'requests>=2.31,<3'
      - run: python -m pytest tests/test_crypto_social_pilot.py tests/test_crypto_social_tracking.py tests/test_crypto_social_history.py tests/test_crypto_social_catchup.py tests/test_crypto_market_history.py tests/test_crypto_event_study.py tests/test_crypto_coins.py tests/test_crypto_rankings_cache.py tests/test_intelligence_fusion.py tests/test_crypto_hour_profile.py -q
        env:
          CRYPTO_SOCIAL_TEST_DATABASE_URL: postgresql://postgres:disposable-test-password@localhost:5432/crypto_test
          # Fail rather than skip: a dead service must not report a green suite.
          REQUIRE_DB_TESTS: '1'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test apps/web/lib/crypto-social.test.ts apps/web/lib/crypto-run.test.ts apps/web/lib/crypto-coin-discovery.test.ts apps/web/lib/crypto-voices.test.ts apps/web/lib/crypto-watchers.test.ts apps/web/lib/crypto-impact.test.ts apps/web/lib/crypto-coins.test.ts apps/web/lib/crypto-leaders.test.ts apps/web/lib/crypto-signals.test.ts apps/web/lib/crypto-workspace.test.ts apps/web/lib/intelligence-fusion.test.ts apps/web/lib/crypto-hour-profile.test.ts
