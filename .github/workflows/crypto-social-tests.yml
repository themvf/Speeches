name: Crypto Social Pilot Tests
on:
  pull_request:
    paths:
      - 'crypto_social*.py'
      - 'crypto_market_history.py'
      - 'sql/crypto_market_history.sql'
      - 'tests/test_crypto_market_history.py'
      - '.github/workflows/crypto-market-history.yml'
      - 'sql/crypto_social*.sql'
      - 'tests/test_crypto_social*.py'
      - '.github/workflows/crypto-social*.yml'
      - 'apps/web/lib/crypto-social*'
      - 'apps/web/lib/crypto-run*'
      - 'apps/web/lib/crypto-coin-discovery*'
      - 'apps/web/lib/server/crypto-run*'
      - 'apps/web/components/market/crypto*'
      - 'apps/web/app/api/market/crypto/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: crypto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest 'psycopg2-binary>=2.9,<3' 'requests>=2.31,<3'
      - run: python -m pytest tests/test_crypto_social_pilot.py tests/test_crypto_social_tracking.py tests/test_crypto_social_history.py tests/test_crypto_social_catchup.py tests/test_crypto_market_history.py -q
        env:
          CRYPTO_SOCIAL_TEST_DATABASE_URL: postgresql://postgres:disposable-test-password@localhost:5432/crypto_test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test apps/web/lib/crypto-social.test.ts apps/web/lib/crypto-run.test.ts apps/web/lib/crypto-coin-discovery.test.ts
