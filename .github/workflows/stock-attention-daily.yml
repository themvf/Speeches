name: Stock Attention Daily Rollup

on:
  schedule:
    - cron: "15 0 * * *"   # aggregate the just-closed UTC day (spec §6.1)
  workflow_dispatch:
    inputs:
      date:
        description: "UTC day to (re)aggregate, YYYY-MM-DD (default: yesterday). Re-runs are safe - the date is recomputed wholesale."
        required: false
        default: ""
      dry_run:
        description: "Report the rollup; write and prune nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stock-attention-daily
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TARGET_DATE: ${{ github.event.inputs.date || '' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aggregate daily stock attention
        run: |
          set -euo pipefail
          args=(--summary-path stock_attention_summary.json)
          if [ -n "${TARGET_DATE}" ]; then
            args+=(--date "${TARGET_DATE}")
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python aggregate_stock_attention.py "${args[@]}"

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-attention-summary-${{ github.run_id }}
          path: stock_attention_summary.json
          if-no-files-found: ignore
