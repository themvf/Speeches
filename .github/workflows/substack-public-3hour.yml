name: Substack Public Sources Every 3 Hours

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: "Optional comma-separated Substack search keywords. Leave blank to use current Intel Feed topic-rule keywords."
        required: false
        default: ""
      max_pages:
        description: "Search result pages per keyword"
        required: false
        default: "1"
      extraction_limit:
        description: "Maximum retained posts to extract"
        required: false
        default: "60"
      model:
        description: "OpenAI model for relevance filtering"
        required: false
        default: "gpt-5-mini"

permissions:
  contents: read

concurrency:
  group: substack-public-3hour
  cancel-in-progress: false

jobs:
  substack-public:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
      SUBSTACK_PROXY_URL: ${{ secrets.SUBSTACK_PROXY_URL || secrets.RESIDENTIAL_PROXY_URL || secrets.APIFY_PROXY_URL }}
      KEYWORDS: ${{ github.event.inputs.keywords || '' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '1' }}
      EXTRACTION_LIMIT: ${{ github.event.inputs.extraction_limit || '60' }}
      MODEL: ${{ github.event.inputs.model || 'gpt-5-mini' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract and Filter Substack Public Sources
        run: |
          set -euo pipefail
          python run_connector_extraction_pipeline.py \
            --connector substack_public_article \
            --keywords "${KEYWORDS}" \
            --relevance-model "${MODEL}" \
            --selection new_or_updated \
            --limit "${EXTRACTION_LIMIT}" \
            --max-pages "${MAX_PAGES}" \
            --require-remote-persistence \
            --summary-path substack_public_extraction_summary.json

      - name: Check for Substack Changes
        id: extraction_summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("substack_public_extraction_summary.json")
          payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          changed_count = int(payload.get("saved_new", 0) or 0) + int(payload.get("saved_updates", 0) or 0)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed_count={changed_count}\n")
          print(f"Substack new or updated documents: {changed_count}")
          PY

      - name: Write Skipped Substack Enrichment Summary
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "mode": "enrich",
              "source_kind": "substack_public_article",
              "skipped": True,
              "reason": "automatic_enrichment_paused",
              "ran_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "processed_count": 0,
              "enriched_count": 0,
              "fallback_enriched_count": 0,
          }
          Path("substack_public_enrich_summary.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload Substack Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: substack-public-3hour-${{ github.run_id }}
          path: |
            substack_public_extraction_summary.json
            substack_public_enrich_summary.json
          if-no-files-found: ignore
