name: Import assistant sentiment review
on:
  push:
    branches: [main]
    paths: ['import_crypto_sentiment_review.py', 'data/reviews/zcat-sentiment-50-2026-09-14.json', '.github/workflows/crypto-assistant-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crypto-assistant-review
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'psycopg2-binary>=2.9,<3'
      - run: python import_crypto_sentiment_review.py
