name: Filing Catalyst Sync

# SEC-50: 8-K + Form 4 catalyst chips for the tracked industry universe.
# Every 2 hours during EDGAR acceptance hours (weekdays 10-22 UTC plus a 00/02 UTC
# evening wrap), and a reconcile at 09:00 UTC on weekdays that reads the complete
# form.idx. Dispatched by the Vercel dispatcher at the top of the hour, with
# mode passed explicitly since there is no cron string to infer it from.
on:
  # No schedule: the Vercel dispatcher starts this in the top-of-hour window
  # (apps/web/lib/server/github-dispatch.ts) so it cannot wake Neon off-window.
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: false
        type: choice
        options: [detect, reconcile]
        default: detect

permissions:
  contents: read

concurrency:
  group: filing-catalyst-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync filing catalysts
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode || '' }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "50 9 * * 1-5" ]; then MODE=reconcile; else MODE=detect; fi
          fi
          python filing_catalyst_sync.py --$MODE | tee filing_catalyst_summary.json

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filing-catalyst-summary-${{ github.run_id }}
          path: filing_catalyst_summary.json
          if-no-files-found: ignore
