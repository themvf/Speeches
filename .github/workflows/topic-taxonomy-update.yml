name: Topic Taxonomy Update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topic-taxonomy-update
  cancel-in-progress: false

jobs:
  apply-topic-taxonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Apply Topic Taxonomy Update
        working-directory: apps/web
        run: node --experimental-strip-types scripts/apply-topic-taxonomy-update.ts
