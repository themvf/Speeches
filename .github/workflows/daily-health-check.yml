name: Daily Health Check

on:
  schedule:
    - cron: "0 9 * * *"  # 9 AM UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Health Check
        id: health
        run: |
          set -euo pipefail
          python run_daily_health_check.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open GitHub Issue on Failures
        if: steps.health.outputs.has_failures == 'true'
        run: |
          title=$(cat health_report_title.txt)
          gh issue create \
            --title "$title" \
            --body-file health_report_body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_id }}
          path: |
            health_report_title.txt
            health_report_body.md
            health_report.json
          if-no-files-found: ignore
