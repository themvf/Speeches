name: Rolling Crypto Collection
on:
  push:
    branches: [agent/voice-quality]
    paths: ['crypto_social_rolling.py', 'crypto_voice_research.py', '.github/workflows/crypto-social-rolling.yml']
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crypto-social-pilot
  cancel-in-progress: false
jobs:
  safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: crypto_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest 'psycopg2-binary>=2.9,<3' 'requests>=2.31,<3'
      - run: python -m pytest tests/test_crypto_social_pilot.py tests/test_crypto_social_history.py tests/test_crypto_social_rolling.py tests/test_crypto_social_watchers.py -q
        env:
          CRYPTO_SOCIAL_TEST_DATABASE_URL: postgresql://postgres:disposable-test-password@localhost:5432/crypto_test
  capture:
    needs: safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TWITTERAPI_IO_API_KEY: ${{ secrets.TWITTERAPI_IO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'psycopg2-binary>=2.9,<3' 'requests>=2.31,<3'
      - name: Diagnose saved request without paid calls
        run: |
          python - <<'PYCODE'
          import os, json, psycopg2
          with psycopg2.connect(os.environ['DATABASE_URL']) as conn, conn.cursor() as cur:
              cur.execute("SELECT id,endpoint,status,error,parameters->'provider_response' FROM crypto_social_requests WHERE id=1293")
              for _,_,_,_,data in cur.fetchall():
                  users=data.get('users',[]) if isinstance(data,dict) else []
                  missing=[u for u in users if not str(u.get('id','')).isdigit()]
                  print(json.dumps(dict(total=len(users),missing_id=len(missing),missing_field_names=[sorted(u.keys()) for u in missing],unavailable_flags=[u.get('unavailable') is True for u in missing])))
          PYCODE
