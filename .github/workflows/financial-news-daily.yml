name: Daily Financial News Pipeline

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "17 11 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      ingest_limit:
        description: "Max news articles to ingest"
        required: false
        default: "10"
      lookback_days:
        description: "Override NewsAPI lookback window in days"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-financial-news
  cancel-in-progress: false

jobs:
  financial-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
      ENRICH_MODEL: deepseek-v4-flash
      INGEST_LIMIT: ${{ github.event.inputs.ingest_limit || '' }}
      LOOKBACK_DAYS_OVERRIDE: ${{ github.event.inputs.lookback_days || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Time Gate
        id: timegate
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))
          utc_now = datetime.now(timezone.utc)
          event_name = os.getenv("GITHUB_EVENT_NAME", "")
          # GitHub Actions scheduled workflows can start late. Trust the event
          # type instead of checking the runner's wall-clock hour.
          run_now = event_name in {"schedule", "workflow_dispatch"}

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run_now={'true' if run_now else 'false'}\n")
              f.write(f"ny_timestamp={now.isoformat()}\n")
          print(f"New York time: {now.isoformat()} | UTC hour: {utc_now.hour} | run_now={run_now}")
          PY

      - name: Run Financial News Ingest
        if: steps.timegate.outputs.run_now == 'true'
        run: |
          set -euo pipefail
          args=(ingest --require-remote-persistence --summary-path financial_news_ingest_summary.json)
          if [ -n "${INGEST_LIMIT}" ]; then
            args+=(--limit "${INGEST_LIMIT}")
          fi
          if [ -n "${LOOKBACK_DAYS_OVERRIDE}" ]; then
            args+=(--lookback-days "${LOOKBACK_DAYS_OVERRIDE}")
          fi
          python run_financial_news_pipeline.py "${args[@]}"

      - name: Capture Ingest Outputs
        id: ingest_summary
        if: steps.timegate.outputs.run_now == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("financial_news_ingest_summary.json")
          payload = {}
          if path.exists():
            payload = json.loads(path.read_text(encoding="utf-8"))

          processed_count = int(payload.get("processed_count", 0) or 0)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"processed_count={processed_count}\n")
          print(json.dumps(payload, indent=2))
          PY

      - name: Run Financial News Enrichment
        if: steps.timegate.outputs.run_now == 'true'
        run: |
          set -euo pipefail
          python run_financial_news_pipeline.py enrich \
            --require-remote-persistence \
            --source-kind newsapi_article \
            --mode all \
            --doc-ids-from-summary financial_news_ingest_summary.json \
            --provider deepseek \
            --model "${ENRICH_MODEL}" \
            --summary-path financial_news_enrich_summary.json

      - name: Upload Summaries
        if: always() && steps.timegate.outputs.run_now == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: financial-news-summaries-${{ github.run_id }}
          path: |
            financial_news_ingest_summary.json
            financial_news_enrich_summary.json
          if-no-files-found: ignore
