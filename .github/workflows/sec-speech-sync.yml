name: SEC Speech Sync (Scheduled)

on:
  schedule:
    # One deep scan every 6 hours; this is the sole scheduled SEC speech owner.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      extraction_limit:
        description: "Max documents to extract"
        required: false
        default: "50"
      max_pages:
        description: "Listing pages to scan"
        required: false
        default: "10"
      selection:
        description: "Extraction selection scope"
        required: false
        type: choice
        options:
          - new_or_updated
          - all
        default: new_or_updated

permissions:
  contents: read

concurrency:
  group: sec-speech-sync
  cancel-in-progress: false

jobs:
  sync:
    # SEC-20: keep manual recovery available while scheduled snapshot reads are paused.
    if: github.event_name != 'schedule' || vars.ENABLE_GCS_SNAPSHOT_SCHEDULES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONNECTOR: sec_speech
      SELECTION: ${{ github.event.inputs.selection || 'new_or_updated' }}
      EXTRACTION_LIMIT: ${{ github.event.inputs.extraction_limit || '50' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '10' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SEC Speech Extraction
        run: |
          set -euo pipefail
          python run_connector_extraction_pipeline.py \
            --connector "${CONNECTOR}" \
            --selection "${SELECTION}" \
            --limit "${EXTRACTION_LIMIT}" \
            --max-pages "${MAX_PAGES}" \
            --include-pdfs true \
            --include-rss false \
            --exclude-terms "" \
            --require-remote-persistence \
            --summary-path sec_speech_sync_summary.json

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-speech-sync-summary-${{ github.run_id }}
          path: sec_speech_sync_summary.json
          if-no-files-found: ignore
