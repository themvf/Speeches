name: SEC Speech Sync (Scheduled)

on:
  schedule:
    # 03:00, 11:00, 19:00 UTC → 10 PM, 6 AM, 2 PM EST
    - cron: "0 3,11,19 * * *"
  workflow_dispatch:
    inputs:
      extraction_limit:
        description: "Max documents to extract"
        required: false
        default: "50"
      max_pages:
        description: "Listing pages to scan"
        required: false
        default: "10"
      selection:
        description: "Extraction selection scope"
        required: false
        type: choice
        options:
          - new_or_updated
          - all
        default: new_or_updated

permissions:
  contents: read

concurrency:
  group: sec-speech-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      CONNECTOR: sec_speech
      SELECTION: ${{ github.event.inputs.selection || 'new_or_updated' }}
      EXTRACTION_LIMIT: ${{ github.event.inputs.extraction_limit || '50' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '10' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SEC Speech Extraction
        run: |
          set -euo pipefail
          python run_connector_extraction_pipeline.py \
            --connector "${CONNECTOR}" \
            --selection "${SELECTION}" \
            --limit "${EXTRACTION_LIMIT}" \
            --max-pages "${MAX_PAGES}" \
            --include-pdfs true \
            --include-rss false \
            --exclude-terms "" \
            --require-remote-persistence \
            --summary-path sec_speech_sync_summary.json

      - name: Check for SEC Speech Changes
        id: extraction_summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("sec_speech_sync_summary.json")
          payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          changed_count = int(payload.get("saved_new", 0) or 0) + int(payload.get("saved_updates", 0) or 0)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed_count={changed_count}\n")
          print(f"SEC speeches new or updated: {changed_count}")
          PY

      - name: Enrich SEC Speeches
        if: steps.extraction_summary.outputs.changed_count != '0'
        run: |
          set -euo pipefail
          python run_financial_news_pipeline.py enrich \
            --require-remote-persistence \
            --source-kind sec_speech \
            --mode only_missing_or_failed \
            --doc-ids-from-summary sec_speech_sync_summary.json \
            --model gpt-4o-mini \
            --summary-path sec_speech_enrich_summary.json

      - name: Upload Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-speech-sync-summary-${{ github.run_id }}
          path: |
            sec_speech_sync_summary.json
            sec_speech_enrich_summary.json
          if-no-files-found: ignore
