name: Backfill Neon Documents (One-Time)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report counts only; no Neon writes (default true - a deliberate first run should flip this to false)"
        required: false
        type: boolean
        default: true
      limit:
        description: "Only backfill the first N documents (0 = all). Useful for a small test run before backfilling everything."
        required: false
        default: "0"
      batch_size:
        description: "Documents per multi-row upsert statement"
        required: false
        default: "200"
      verify_sample:
        description: "Spot-check this many random documents after backfilling (0 to skip)"
        required: false
        default: "25"

permissions:
  contents: read

concurrency:
  group: backfill-neon-documents
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      LIMIT: ${{ github.event.inputs.limit || '0' }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '200' }}
      VERIFY_SAMPLE: ${{ github.event.inputs.verify_sample || '25' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill custom_documents.json into Neon
        run: |
          set -euo pipefail
          args=(--batch-size "${BATCH_SIZE}" --limit "${LIMIT}" --verify-sample "${VERIFY_SAMPLE}" --summary-path backfill_neon_documents_summary.json)
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python backfill_neon_documents.py "${args[@]}"

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-neon-documents-summary-${{ github.run_id }}
          path: backfill_neon_documents_summary.json
          if-no-files-found: ignore
