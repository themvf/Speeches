name: Backfill Neon Documents (One-Time)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report counts only; no Neon writes (default true - a deliberate first run should flip this to false)"
        required: false
        type: boolean
        default: true
      limit:
        description: "Only backfill the first N documents (0 = all). Useful for a small test run before backfilling everything."
        required: false
        default: "0"
      batch_size:
        description: "Documents per multi-row upsert statement"
        required: false
        default: "200"
      verify_sample:
        description: "Spot-check this many random documents after backfilling (0 to skip)"
        required: false
        default: "25"
      include_enrichment:
        description: "Also mirror document enrichment state into row-level Neon storage"
        required: false
        type: boolean
        default: true
      include_speeches:
        description: "Also normalize and mirror legacy all_speeches.json records"
        required: false
        type: boolean
        default: true
      only_missing:
        description: "Additive repair: upsert only documents Neon has never seen (safe to run any time; never overwrites newer Neon rows)"
        required: false
        type: boolean
        default: false
      force:
        description: "Allow overwriting an existing verified backfill (only during a full writer freeze)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sec20-neon-corpus-writers
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRY_RUN: ${{ inputs.dry_run }}
      LIMIT: ${{ inputs.limit }}
      BATCH_SIZE: ${{ inputs.batch_size }}
      VERIFY_SAMPLE: ${{ inputs.verify_sample }}
      INCLUDE_ENRICHMENT: ${{ inputs.include_enrichment }}
      INCLUDE_SPEECHES: ${{ inputs.include_speeches }}
      ONLY_MISSING: ${{ inputs.only_missing }}
      FORCE: ${{ inputs.force }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill document and enrichment snapshots into Neon
        run: |
          set -euo pipefail
          args=(--batch-size "${BATCH_SIZE}" --limit "${LIMIT}" --verify-sample "${VERIFY_SAMPLE}" --summary-path backfill_neon_documents_summary.json)
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "${INCLUDE_ENRICHMENT}" = "true" ]; then
            args+=(--include-enrichment)
          fi
          if [ "${INCLUDE_SPEECHES}" = "true" ]; then
            args+=(--include-speeches)
          fi
          if [ "${FORCE}" = "true" ]; then
            args+=(--force)
          fi
          if [ "${ONLY_MISSING}" = "true" ]; then
            args+=(--only-missing)
          fi
          python backfill_neon_documents.py "${args[@]}"

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-neon-documents-summary-${{ github.run_id }}
          path: backfill_neon_documents_summary.json
          if-no-files-found: ignore
