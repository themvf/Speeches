name: Policy Extraction (On Demand)

on:
  workflow_dispatch:
    inputs:
      connector:
        description: "Connector/source_kind to run"
        required: true
        type: choice
        options:
          - sec_speech
          - sec_tm_faq
          - sec_enforcement_litigation
          - finra_awc
          - finra_regulatory_notice
          - finra_comment_letter
          - doj_usao_press_release
          - federal_reserve_speech_testimony
          - cisa_cybersecurity_advisory
          - cftc_press_release
          - cftc_public_statement_remark
          - treasury_featured_story
          - treasury_press_release
          - treasury_statement_remark
          - sec_press_release_rss
          - sec_administrative_proceeding
          - sec_trading_suspension
          - sec_federal_register
          - sec_pcaob_rulemaking
          - pcaob_update
          - msrb_press_release
          - congress_crs_product
          - senate_committee_site
          - sifma_news_item
          - jdsupra_article
          - investmentnews_article
          - citywire_article
          - therecord_media_article
          - krebs_on_security_article
          - the_hacker_news_article
          - welivesecurity_article
          - sophos_security_operations_article
          - flashpoint_blog_article
          - recorded_future_article
          - intel471_blog_article
          - securityweek_article
          - dark_reading_article
          - wired_article
          - tripwire_article
          - akamai_blog_article
          - ritholtz_article
          - ft_portfolios_market_commentary
          - liberty_street_economics_article
          - wealth_of_common_sense_article
          - ici_news_item
          - isda_news_item
          - mfa_news_item
          - fia_news_item
          - aba_news_item
          - bpi_news_item
          - icba_news_item
          - lsta_news_item
          - wsj_dow_jones
          - reddit_post
          - substack_public_article
          - sec_youtube_video
          - youtube_video
          - bloomberg_public_latest
          - bloomberg_public_article
        default: sec_enforcement_litigation
      selection:
        description: "Extraction selection scope"
        required: false
        type: choice
        options:
          - new_or_updated
          - all
        default: new_or_updated
      extraction_limit:
        description: "Max documents to extract"
        required: false
        default: "25"
      max_pages:
        description: "Listing pages to scan"
        required: false
        default: "5"
      base_url:
        description: "Optional connector index URL override"
        required: false
        default: ""
      include_pdfs:
        description: "Include PDF links (SEC TM FAQ)"
        required: false
        type: boolean
        default: true
      include_rss:
        description: "Use RSS supplement (FINRA notices)"
        required: false
        type: boolean
        default: true
      exclude_terms:
        description: "Optional comma-separated exclude phrases (used by DOJ press releases)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: policy-extraction-manual
  cancel-in-progress: false

jobs:
  extract-policy-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
      CRS_PROXY_URL: ${{ secrets.CRS_PROXY_URL || secrets.RESIDENTIAL_PROXY_URL }}
      SIFMA_PROXY_URL: ${{ secrets.SIFMA_PROXY_URL || secrets.RESIDENTIAL_PROXY_URL }}
      WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
      WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      CONNECTOR: ${{ github.event.inputs.connector }}
      SELECTION: ${{ github.event.inputs.selection || 'new_or_updated' }}
      EXTRACTION_LIMIT: ${{ github.event.inputs.extraction_limit || '25' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '5' }}
      BASE_URL: ${{ github.event.inputs.base_url || '' }}
      INCLUDE_PDFS: ${{ github.event.inputs.include_pdfs || 'true' }}
      INCLUDE_RSS: ${{ github.event.inputs.include_rss || 'true' }}
      EXCLUDE_TERMS: ${{ github.event.inputs.exclude_terms || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Connector Extraction
        run: |
          set -euo pipefail
          args=(--connector "${CONNECTOR}" --selection "${SELECTION}" --limit "${EXTRACTION_LIMIT}" --max-pages "${MAX_PAGES}" --include-pdfs "${INCLUDE_PDFS}" --include-rss "${INCLUDE_RSS}" --exclude-terms "${EXCLUDE_TERMS}" --require-remote-persistence --summary-path policy_extraction_summary.json)
          if [ -n "${BASE_URL}" ]; then
            args+=(--base-url "${BASE_URL}")
          fi
          python run_connector_extraction_pipeline.py "${args[@]}"

      - name: Upload Extraction Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-extraction-summary-${{ github.run_id }}
          path: policy_extraction_summary.json
          if-no-files-found: ignore
