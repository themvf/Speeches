name: SEC YouTube Videos Daily

on:
  schedule:
    - cron: "20 14 * * *"
  workflow_dispatch:
    inputs:
      channel_ref:
        description: "YouTube video URL/id for ad hoc analysis, or channel URL/id/handle for one-time retrieval. Leave blank to use saved channels."
        required: false
        default: ""
      extraction_limit:
        description: "Maximum videos to extract"
        required: false
        default: "10"
      max_pages:
        description: "RSS pages equivalent to scan"
        required: false
        default: "1"
      enrich_limit:
        description: "Maximum video transcript documents to enrich"
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: sec-youtube-videos-daily
  cancel-in-progress: false

jobs:
  sec-youtube-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
      WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
      WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
      YOUTUBE_PROXY_URL: ${{ secrets.YOUTUBE_PROXY_URL }}
      CHANNEL_REF: ${{ github.event.inputs.channel_ref || '' }}
      EXTRACTION_LIMIT: ${{ github.event.inputs.extraction_limit || '10' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '1' }}
      ENRICH_LIMIT: ${{ github.event.inputs.enrich_limit || '10' }}
      ENRICH_MODEL: deepseek-v4-flash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract and Enrich SEC YouTube Video Transcripts
        run: |
          set -euo pipefail
          python run_youtube_video_pipeline.py \
            --channel-ref "${CHANNEL_REF}" \
            --extraction-limit "${EXTRACTION_LIMIT}" \
            --max-pages "${MAX_PAGES}" \
            --enrich-limit "${ENRICH_LIMIT}" \
            --provider deepseek \
            --model "${ENRICH_MODEL}" \
            --require-remote-persistence \
            --summary-path sec_youtube_video_pipeline_summary.json

      - name: Upload SEC YouTube Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-youtube-videos-${{ github.run_id }}
          path: |
            sec_youtube_video_*summary*.json
          if-no-files-found: ignore
