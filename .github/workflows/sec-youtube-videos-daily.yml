name: YouTube Channels Daily

on:
  schedule:
    - cron: "20 14 * * *"
  workflow_dispatch:
    inputs:
      channel_ref:
        description: "Optional single channel override. Leave blank to run all active saved channels."
        required: false
        default: ""
      extraction_limit:
        description: "Maximum videos to extract"
        required: false
        default: "2"
      max_pages:
        description: "RSS pages equivalent to scan"
        required: false
        default: "1"
      enrich_limit:
        description: "Maximum video transcript documents to enrich"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: youtube-channels-daily
  cancel-in-progress: false

jobs:
  youtube-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
      WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
      WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
      YOUTUBE_PROXY_URL: ${{ secrets.YOUTUBE_PROXY_URL }}
      CHANNEL_REF: ${{ github.event.inputs.channel_ref || '' }}
      EXTRACTION_LIMIT: ${{ github.event.inputs.extraction_limit || '2' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '1' }}
      ENRICH_LIMIT: ${{ github.event.inputs.enrich_limit || '2' }}
      ENRICH_MODEL: deepseek-v4-pro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract and Enrich YouTube Channel Transcripts
        run: |
          set -euo pipefail
          python scripts/run_youtube_channel_sources.py \
            --channel-ref "${CHANNEL_REF}" \
            --extraction-limit "${EXTRACTION_LIMIT}" \
            --max-pages "${MAX_PAGES}" \
            --enrich-limit "${ENRICH_LIMIT}" \
            --provider deepseek \
            --model "${ENRICH_MODEL}" \
            --require-remote-persistence \
            --summary-path youtube_channel_sources_run_summary.json

      - name: Upload YouTube Channel Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channels-${{ github.run_id }}
          path: |
            youtube_channel_sources_run_summary.json
            youtube_channel_*_extraction_summary.json
            youtube_channel_*_enrich_summary.json
          if-no-files-found: ignore
