name: Re-enrich GPT Fallbacks

on:
  workflow_dispatch:
    inputs:
      model:
        description: "DeepSeek model to use"
        required: false
        default: "deepseek-v4-flash"
      max_docs:
        description: "Maximum corpus documents to process; 0 means all found"
        required: false
        default: "0"
      rss_limit:
        description: "Maximum RSS analyses to process"
        required: false
        default: "500"
      dry_run:
        description: "Find records without writing changes"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reenrich-gpt-fallback
  cancel-in-progress: false

jobs:
  reenrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MODEL: ${{ github.event.inputs.model || 'deepseek-v4-flash' }}
      MAX_DOCS: ${{ github.event.inputs.max_docs || '0' }}
      RSS_LIMIT: ${{ github.event.inputs.rss_limit || '500' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Re-enrich GPT fallback records
        run: |
          set -euo pipefail
          args=(--require-remote-persistence --model "${MODEL}" --max-docs "${MAX_DOCS}" --rss-limit "${RSS_LIMIT}" --summary-path gpt_fallback_reenrich_summary.json)
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/re_enrich_gpt_fallback.py "${args[@]}"

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-fallback-reenrich-summary-${{ github.run_id }}
          path: gpt_fallback_reenrich_summary.json
          if-no-files-found: ignore
