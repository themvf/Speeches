name: Connector Gap Ingest (6 Hour)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-gap-6hour
  cancel-in-progress: false

jobs:
  extract:
    # SEC-20: keep manual recovery available while scheduled snapshot reads are paused.
    if: github.event_name != 'schedule' || vars.ENABLE_GCS_SNAPSHOT_SCHEDULES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - connector: federal_reserve_speech_testimony
            extraction_limit: "25"
            max_pages: "3"
          - connector: treasury_statement_remark
            extraction_limit: "25"
            max_pages: "3"
          - connector: treasury_press_release
            extraction_limit: "25"
            max_pages: "3"
          - connector: treasury_featured_story
            extraction_limit: "25"
            max_pages: "3"
          - connector: sec_tm_faq
            extraction_limit: "25"
            max_pages: "1"
          - connector: jdsupra_article
            extraction_limit: "25"
            max_pages: "3"
          - connector: investmentnews_article
            extraction_limit: "25"
            max_pages: "3"
          - connector: citywire_article
            extraction_limit: "25"
            max_pages: "3"
          - connector: therecord_media_article
            extraction_limit: "25"
            max_pages: "3"
          - connector: krebs_on_security_article
            extraction_limit: "25"
            max_pages: "2"
          - connector: the_hacker_news_article
            extraction_limit: "25"
            max_pages: "2"
          - connector: welivesecurity_article
            extraction_limit: "25"
            max_pages: "2"
          - connector: sophos_security_operations_article
            extraction_limit: "25"
            max_pages: "2"
          - connector: flashpoint_blog_article
            extraction_limit: "25"
            max_pages: "2"
          - connector: recorded_future_article
            extraction_limit: "25"
            max_pages: "2"
          - connector: intel471_blog_article
            extraction_limit: "25"
            max_pages: "2"
          - connector: securityweek_article
            extraction_limit: "25"
            max_pages: "2"
          - connector: dark_reading_article
            extraction_limit: "25"
            max_pages: "2"
          - connector: wired_article
            extraction_limit: "25"
            max_pages: "3"
          - connector: tripwire_article
            extraction_limit: "25"
            max_pages: "3"
          - connector: akamai_blog_article
            extraction_limit: "25"
            max_pages: "3"
          - connector: ritholtz_article
            extraction_limit: "25"
            max_pages: "3"
          - connector: ft_portfolios_market_commentary
            extraction_limit: "25"
            max_pages: "3"
          - connector: liberty_street_economics_article
            extraction_limit: "25"
            max_pages: "3"
          - connector: wealth_of_common_sense_article
            extraction_limit: "25"
            max_pages: "3"
          - connector: ici_news_item
            extraction_limit: "25"
            max_pages: "2"
          - connector: isda_news_item
            extraction_limit: "25"
            max_pages: "2"
          - connector: mfa_news_item
            extraction_limit: "25"
            max_pages: "2"
          - connector: fia_news_item
            extraction_limit: "25"
            max_pages: "2"
          - connector: aba_news_item
            extraction_limit: "25"
            max_pages: "2"
          - connector: bpi_news_item
            extraction_limit: "25"
            max_pages: "2"
          - connector: icba_news_item
            extraction_limit: "25"
            max_pages: "2"
          - connector: lsta_news_item
            extraction_limit: "25"
            max_pages: "2"
          - connector: ipa_news_item
            extraction_limit: "25"
            max_pages: "2"
          - connector: adisa_news_item
            extraction_limit: "25"
            max_pages: "1"
          - connector: wsj_dow_jones
            extraction_limit: "25"
            max_pages: "3"
          - connector: reddit_post
            extraction_limit: "50"
            max_pages: "1"
          - connector: hedge_fund_letter
            extraction_limit: "25"
            max_pages: "2"

    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
      WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ${{ matrix.connector }}
        run: |
          set -euo pipefail
          python run_connector_extraction_pipeline.py \
            --connector "${{ matrix.connector }}" \
            --selection new_or_updated \
            --limit "${{ matrix.extraction_limit }}" \
            --max-pages "${{ matrix.max_pages }}" \
            --include-pdfs true \
            --include-rss true \
            --require-remote-persistence \
            --summary-path "connector_gap_${{ matrix.connector }}.json"

      - name: Upload Extraction Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-gap-${{ matrix.connector }}-${{ github.run_id }}
          path: "connector_gap_${{ matrix.connector }}.json"
          if-no-files-found: ignore
