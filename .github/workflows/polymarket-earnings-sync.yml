name: Polymarket Earnings Sync

# Three pulls daily (SEC-26 cadence, user-specified 2026-07-15):
# 13:00, 21:00 and 01:00 UTC (9am, 5pm after the close, and 9pm ET in summer;
# an hour earlier in ET in winter - harmless: ingestion is cursor-based, so
# cadence affects display freshness only, never data completeness).
on:
  # No schedule: the Vercel dispatcher starts this in the top-of-hour window
  # (apps/web/lib/server/github-dispatch.ts) so it cannot wake Neon off-window.
  workflow_dispatch:
    inputs:
      backfill:
        description: "One-time cold start: settle resolved markets into the durable results table (raw fills not stored)"
        required: false
        type: boolean
        default: false
      backfill_markets:
        description: "How many resolved markets to re-settle (default 120). Correctness flags can only be fixed for markets this run actually re-settles - net_win is not stored, so it cannot be re-derived from existing rows."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: polymarket-earnings-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKFILL: ${{ github.event.inputs.backfill || 'false' }}
      BACKFILL_MARKETS: ${{ github.event.inputs.backfill_markets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Polymarket earnings markets
        run: |
          set -euo pipefail
          args=()
          if [ "${BACKFILL}" = "true" ]; then
            args+=(--backfill)
            if [ -n "${BACKFILL_MARKETS}" ]; then args+=(--backfill-markets "${BACKFILL_MARKETS}"); fi
          fi
          python polymarket_earnings_sync.py "${args[@]}" | tee polymarket_sync_summary.json

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-sync-summary-${{ github.run_id }}
          path: polymarket_sync_summary.json
          if-no-files-found: ignore
