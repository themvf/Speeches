name: Bloomberg Public Feed Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      extraction_limit:
        description: "Max Bloomberg items to extract"
        required: false
        default: "20"
      max_pages:
        description: "Max Bloomberg RSS items to discover"
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: bloomberg-public-hourly
  cancel-in-progress: false

jobs:
  bloomberg-public:
    # SEC-20: keep manual recovery available while scheduled snapshot reads are paused.
    if: github.event_name != 'schedule' || vars.ENABLE_GCS_SNAPSHOT_SCHEDULES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
      ENRICH_MODEL: deepseek-v4-pro
      EXTRACTION_LIMIT: ${{ github.event.inputs.extraction_limit || '20' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '20' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Bloomberg Public Feed
        run: |
          set -euo pipefail
          python run_connector_extraction_pipeline.py \
            --connector bloomberg_public_latest \
            --selection new_or_updated \
            --limit "${EXTRACTION_LIMIT}" \
            --max-pages "${MAX_PAGES}" \
            --include-pdfs false \
            --include-rss false \
            --require-remote-persistence \
            --summary-path bloomberg_public_extraction_summary.json

      - name: Check for Bloomberg Changes
        id: extraction_summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("bloomberg_public_extraction_summary.json")
          payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          changed_count = int(payload.get("saved_new", 0) or 0) + int(payload.get("saved_updates", 0) or 0)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed_count={changed_count}\n")
          print(f"Bloomberg new or updated documents: {changed_count}")
          PY

      - name: Run Bloomberg Enrichment
        if: steps.extraction_summary.outputs.changed_count != '0'
        run: |
          set -euo pipefail
          python run_financial_news_pipeline.py enrich \
            --require-remote-persistence \
            --source-kind bloomberg_public_article \
            --mode all \
            --doc-ids-from-summary bloomberg_public_extraction_summary.json \
            --provider deepseek \
            --model "${ENRICH_MODEL}" \
            --summary-path bloomberg_public_enrich_summary.json

      - name: Upload Bloomberg Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloomberg-public-hourly-${{ github.run_id }}
          path: |
            bloomberg_public_extraction_summary.json
            bloomberg_public_enrich_summary.json
          if-no-files-found: ignore
