name: Bloomberg Public Feed Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      extraction_limit:
        description: "Max Bloomberg items to extract"
        required: false
        default: "20"
      max_pages:
        description: "Max Bloomberg RSS items to discover"
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: bloomberg-public-hourly
  cancel-in-progress: false

jobs:
  bloomberg-public:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      EXTRACTION_LIMIT: ${{ github.event.inputs.extraction_limit || '20' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '20' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Bloomberg Public Feed
        run: |
          set -euo pipefail
          python run_connector_extraction_pipeline.py \
            --connector bloomberg_public_latest \
            --selection new_or_updated \
            --limit "${EXTRACTION_LIMIT}" \
            --max-pages "${MAX_PAGES}" \
            --include-pdfs false \
            --include-rss false \
            --require-remote-persistence \
            --summary-path bloomberg_public_extraction_summary.json

      - name: Check for Bloomberg Changes
        id: extraction_summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("bloomberg_public_extraction_summary.json")
          payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          changed_count = int(payload.get("saved_new", 0) or 0) + int(payload.get("saved_updates", 0) or 0)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed_count={changed_count}\n")
          print(f"Bloomberg new or updated documents: {changed_count}")
          PY

      - name: Write Skipped Bloomberg Enrichment Summary
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "mode": "enrich",
              "source_kind": "bloomberg_public_article",
              "skipped": True,
              "reason": "automatic_enrichment_paused",
              "ran_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "processed_count": 0,
              "enriched_count": 0,
              "fallback_enriched_count": 0,
          }
          Path("bloomberg_public_enrich_summary.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload Bloomberg Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloomberg-public-hourly-${{ github.run_id }}
          path: |
            bloomberg_public_extraction_summary.json
            bloomberg_public_enrich_summary.json
          if-no-files-found: ignore
