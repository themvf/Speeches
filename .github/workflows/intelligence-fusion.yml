name: Intelligence fusion materializer

on:
  workflow_dispatch:
  # No schedule: the Vercel dispatcher starts this in the top-of-hour window
  # (apps/web/lib/server/github-dispatch.ts) so it cannot wake Neon off-window.

concurrency:
  group: intelligence-fusion-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install psycopg2-binary
      - run: python intelligence_fusion.py
      - run: python intelligence_fusion.py --execute

