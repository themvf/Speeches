name: Backpack on-chain thesis monitor
on:
  push:
    branches: [main]
    paths: ['backpack/starter_universe.json', 'backpack/registry.py', 'backpack/readiness.py', 'backpack_monitor.py', 'sql/backpack.sql', '.github/workflows/backpack-monitor.yml']
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
permissions:
  contents: read
concurrency:
  group: backpack-daily-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      SOLANA_VALIDATION_RPC_URL: ${{ secrets.SOLANA_VALIDATION_RPC_URL }}
      BACKPACK_REVALIDATE_SECRET: ${{ secrets.BACKPACK_REVALIDATE_SECRET }}
      BACKPACK_DATABASE_ALLOWANCE_BYTES: ${{ vars.BACKPACK_DATABASE_ALLOWANCE_BYTES }}
      BACKPACK_HOLDER_RETENTION_DAYS: ${{ vars.BACKPACK_HOLDER_RETENTION_DAYS || '30' }}
      BACKPACK_SWAP_RETENTION_DAYS: ${{ vars.BACKPACK_SWAP_RETENTION_DAYS || '30' }}
      BACKPACK_ISSUANCE_GROWTH_PCT: ${{ vars.BACKPACK_ISSUANCE_GROWTH_PCT || '1' }}
      BACKPACK_TRADING_GROWTH_PCT: ${{ vars.BACKPACK_TRADING_GROWTH_PCT || '20' }}
      BACKPACK_ADOPTION_GROWTH_PCT: ${{ vars.BACKPACK_ADOPTION_GROWTH_PCT || '1' }}
      BACKPACK_GROWTH_ISSUANCE_PCT: ${{ vars.BACKPACK_GROWTH_ISSUANCE_PCT || '0.1' }}
      BACKPACK_GROWTH_HOLDERS_PCT: ${{ vars.BACKPACK_GROWTH_HOLDERS_PCT || '1' }}
      BACKPACK_GROWTH_SLOWDOWN_PP: ${{ vars.BACKPACK_GROWTH_SLOWDOWN_PP || '0.25' }}
      BACKPACK_SIGNIFICANT_AUM_USD: ${{ vars.BACKPACK_SIGNIFICANT_AUM_USD || '1000000' }}
      BACKPACK_MAX_REQUESTS: '500'
      BACKPACK_MAX_ACTIVITY_WALLETS: '10'
      BACKPACK_ENABLE_QUOTES: '1'
      BACKPACK_WHALE_THRESHOLDS_USD: ${{ vars.BACKPACK_WHALE_THRESHOLDS_USD || '100000,500000,1000000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg2-binary>=2.9,<3' 'requests>=2.31,<3' 'exchange-calendars>=4.5,<5' pytest
      - name: Calculation and provider regression gate
        run: python -m pytest tests/test_backpack.py -q
      - name: Initialize schema and validate production access
        id: preflight
        continue-on-error: true
        shell: bash
        run: python backpack_monitor.py --migrate --preflight | tee backpack-preflight.jsonl
      - name: Register curated starter mints after primary-source and chain revalidation
        id: registry
        continue-on-error: true
        shell: bash
        run: python backpack_monitor.py --seed-starter | tee backpack-registry.jsonl
      - name: Validate capture readiness after registry setup
        id: readiness
        continue-on-error: true
        shell: bash
        run: python backpack_monitor.py --preflight | tee backpack-readiness.jsonl
      - name: Capture current UTC date
        id: capture
        if: github.event_name != 'push' || steps.readiness.outcome == 'success'
        run: python backpack_monitor.py --execute
      - name: Reconcile stored observations for human review
        if: always() && (github.event_name != 'push' || steps.readiness.outcome == 'success')
        shell: bash
        run: python backpack_monitor.py --audit | tee backpack-audit.jsonl
      - name: Revalidate public data after capture and reconciliation
        if: success() && steps.capture.outcome == 'success'
        run: python -m backpack.revalidation
      - name: Maintain bounded storage and record infrastructure observations
        if: always() && steps.preflight.outcome != 'skipped'
        shell: bash
        run: python backpack_monitor.py --research --maintenance --cost-report | tee backpack-cost.jsonl
      - name: Preserve sanitized production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backpack-readiness-${{ github.run_id }}
          path: backpack-*.jsonl
          retention-days: 30
      - name: Report unresolved readiness checks
        if: steps.readiness.outcome == 'failure' || steps.registry.outcome == 'failure'
        run: exit 1
