name: Knowledge Index Sync

on:
  workflow_run:
    workflows: ["SEC Speech Sync (Scheduled)", "Policy Extraction (On Demand)", "Policy Extraction (Scheduled)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      org:
        description: "Org key to sync (e.g. sec, finra). Leave blank to sync all orgs."
        required: false
        default: ""
      force_rebuild:
        description: "Force rebuild — delete and recreate vector stores from scratch."
        required: false
        default: "false"
        type: boolean
      dry_run:
        description: "Dry run — plan only, no OpenAI or GCS writes."
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  sync:
    # SEC-20: do not turn a skipped scheduled producer into another full snapshot read.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event != 'schedule' ||
      vars.ENABLE_GCS_SNAPSHOT_SCHEDULES == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        run: |
          set -euo pipefail
          python sync_knowledge_index.py \
            ${{ inputs.org != '' && format('--org {0}', inputs.org) || '' }} \
            ${{ inputs.force_rebuild == 'true' && '--force-rebuild' || '' }} \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
