name: Backpack methodology and storage tests
on:
  pull_request:
    paths: ['backpack/**', 'backpack_monitor.py', 'sql/backpack.sql', 'tests/test_backpack*', 'apps/web/**', '.github/workflows/backpack-*.yml']
  push:
    branches: [main]
    paths: ['backpack/**', 'backpack_monitor.py', 'sql/backpack.sql', 'tests/test_backpack*', 'apps/web/lib/backpack*']
permissions:
  contents: read
jobs:
  methodology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: backpack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BACKPACK_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/backpack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest requests psycopg2-binary 'exchange-calendars>=4.5,<5'
      - run: python -m pytest tests/test_backpack.py tests/test_backpack_adoption.py tests/test_backpack_integration.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types --test apps/web/lib/backpack.test.ts
