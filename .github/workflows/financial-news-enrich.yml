name: Financial News Enrich (On Demand)

on:
  workflow_dispatch:
    inputs:
      enrich_limit:
        description: "Max articles to enrich"
        required: false
        default: "25"
      mode:
        description: "Enrichment mode"
        required: false
        type: choice
        options:
          - only_missing_or_failed
          - all
        default: only_missing_or_failed
      source_kind:
        description: "Source kind to enrich"
        required: false
        default: "newsapi_article"
      order:
        description: "Candidate order before applying enrich_limit"
        required: false
        type: choice
        options:
          - recent
          - stored
        default: recent
      heuristic_only:
        description: "Use heuristic enrichment instead of hosted model enrichment"
        required: false
        type: boolean
        default: false
      provider:
        description: "Hosted model provider"
        required: false
        type: choice
        options:
          - deepseek
          - openai
        default: deepseek
      model:
        description: "Model to use for hosted enrichment"
        required: false
        default: "deepseek-v4-flash"

permissions:
  contents: read

concurrency:
  group: financial-news-enrich-manual
  cancel-in-progress: false

jobs:
  enrich-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ENRICH_LIMIT: ${{ github.event.inputs.enrich_limit || '25' }}
      ENRICH_MODE: ${{ github.event.inputs.mode || 'only_missing_or_failed' }}
      SOURCE_KIND: ${{ github.event.inputs.source_kind || 'newsapi_article' }}
      ENRICH_ORDER: ${{ github.event.inputs.order || 'recent' }}
      ENRICH_PROVIDER: ${{ github.event.inputs.provider || 'deepseek' }}
      ENRICH_MODEL: ${{ github.event.inputs.model || 'deepseek-v4-flash' }}
      HEURISTIC_ONLY: ${{ github.event.inputs.heuristic_only || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Financial News Enrichment
        run: |
          set -euo pipefail
          args=(enrich --require-remote-persistence --source-kind "${SOURCE_KIND}" --mode "${ENRICH_MODE}" --order "${ENRICH_ORDER}" --summary-path financial_news_enrich_summary.json)
          if [ -n "${ENRICH_LIMIT}" ]; then
            args+=(--limit "${ENRICH_LIMIT}")
          fi
          args+=(--provider "${ENRICH_PROVIDER}" --model "${ENRICH_MODEL}")
          if [ "${HEURISTIC_ONLY}" = "true" ]; then
            args+=(--heuristic-only)
          fi
          python run_financial_news_pipeline.py "${args[@]}"

      - name: Upload Enrichment Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-news-enrich-summary-${{ github.run_id }}
          path: financial_news_enrich_summary.json
          if-no-files-found: ignore
