name: Financial News Enrich (Scheduled)

on:
  workflow_dispatch:
    inputs:
      enrich_limit:
        description: "Max articles to enrich"
        required: false
        default: "25"
      source_kind:
        description: "Source kind to enrich"
        required: false
        default: "newsapi_article"
      model:
        description: "Model for hosted enrichment"
        required: false
        default: "deepseek-v4-flash"

permissions:
  contents: read

concurrency:
  group: financial-news-enrich-scheduled
  cancel-in-progress: false

jobs:
  enrich-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
      ENRICH_LIMIT: ${{ github.event.inputs.enrich_limit || '25' }}
      SOURCE_KIND: ${{ github.event.inputs.source_kind || 'newsapi_article' }}
      ENRICH_MODEL: ${{ github.event.inputs.model || 'deepseek-v4-flash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Financial News Enrichment
        run: |
          set -euo pipefail
          args=(enrich --require-remote-persistence --mode only_missing_or_failed --source-kind "${SOURCE_KIND}" --provider deepseek --model "${ENRICH_MODEL}" --summary-path financial_news_enrich_summary.json)
          if [ -n "${ENRICH_LIMIT}" ]; then
            args+=(--limit "${ENRICH_LIMIT}")
          fi
          python run_financial_news_pipeline.py "${args[@]}"

      - name: Upload Enrichment Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-news-enrich-summary-${{ github.run_id }}
          path: financial_news_enrich_summary.json
          if-no-files-found: ignore
