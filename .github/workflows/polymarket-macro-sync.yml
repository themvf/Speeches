name: Polymarket Macro Sync

# Capture the pre-release tape after the major 8:30am ET data window, after
# the 2:00pm ET FOMC window, and once overnight. Fill timestamps—not run
# timestamps—drive the early/pre/late/post classification.
on:
  schedule:
    - cron: "45 13 * * 1-5"
    - cron: "45 18 * * 1-5"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill up to 120 resolved recurring US macro releases"
        required: false
        type: boolean
        default: false
      backfill_releases:
        description: "How many releases to re-settle (default 120). Correctness flags are only fixed for releases this run re-settles."
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: polymarket-macro-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKFILL: ${{ github.event.inputs.backfill || 'false' }}
      BACKFILL_RELEASES: ${{ github.event.inputs.backfill_releases }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sync recurring macro markets
        run: |
          set -euo pipefail
          args=()
          if [ "${BACKFILL}" = "true" ]; then
            args+=(--backfill)
            if [ -n "${BACKFILL_RELEASES}" ]; then args+=(--backfill-releases "${BACKFILL_RELEASES}"); fi
          fi
          python polymarket_macro_sync.py "${args[@]}" | tee polymarket_macro_sync_summary.json
      - name: Flag new unclassified macro events
        # Own narrow issue post, not folded into daily-health-check.yml:
        # that workflow's scheduled runs are gated off by
        # ENABLE_GCS_SNAPSHOT_SCHEDULES (SEC-20 GCS-egress cost work) since
        # it reads full GCS corpus snapshots. This scan is 100% Neon-based
        # and shouldn't wait on that gate. No-op when nothing new was found
        # (write_discovery_issue_files only writes the title/body files
        # when there's something to report).
        if: always()
        run: |
          set -euo pipefail
          if [ -f macro_discovery_issue_title.txt ]; then
            gh issue create \
              --title "$(cat macro_discovery_issue_title.txt)" \
              --body-file macro_discovery_issue_body.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-macro-sync-summary-${{ github.run_id }}
          path: |
            polymarket_macro_sync_summary.json
            macro_discovery_issue_title.txt
            macro_discovery_issue_body.md
          if-no-files-found: ignore
