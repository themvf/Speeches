name: Policy Extraction (Scheduled)

on:
  schedule:
    # 10:00 UTC (6 AM ET) and 22:00 UTC (6 PM ET) — covers overnight + post-business-day output
    - cron: "0 10 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-extraction-scheduled
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Run connectors sequentially to avoid concurrent GCS writes to custom_documents.json.
      # fail-fast: false so one connector failing does not skip the others.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - connector: doj_usao_press_release
            extraction_limit: "25"
            max_pages: "5"
          - connector: finra_awc
            extraction_limit: "25"
            max_pages: "5"
          - connector: sec_enforcement_litigation
            extraction_limit: "25"
            max_pages: "5"
          - connector: sec_speech
            extraction_limit: "25"
            max_pages: "5"
          - connector: bloomberg_latest_apify
            extraction_limit: "10"
            max_pages: "10"
          - connector: bloomberg_apify_article
            extraction_limit: "10"
            max_pages: "10"
    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_PROXY_URL: ${{ secrets.APIFY_PROXY_URL }}
      APIFY_BLOOMBERG_ACTOR_ID: ${{ secrets.APIFY_BLOOMBERG_ACTOR_ID }}
      APIFY_BLOOMBERG_INPUT_JSON: ${{ secrets.APIFY_BLOOMBERG_INPUT_JSON }}
      APIFY_BLOOMBERG_DISCOVERY_ACTOR_ID: ${{ secrets.APIFY_BLOOMBERG_DISCOVERY_ACTOR_ID }}
      APIFY_BLOOMBERG_DISCOVERY_INPUT_JSON: ${{ secrets.APIFY_BLOOMBERG_DISCOVERY_INPUT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ${{ matrix.connector }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.connector }}" == bloomberg_* ]] && [ -z "${APIFY_TOKEN:-}" ]; then
            printf '%s\n' '{"ok":true,"connector":"${{ matrix.connector }}","skipped":true,"reason":"APIFY_TOKEN is not configured for scheduled extraction."}' > "policy_extraction_summary_${{ matrix.connector }}.json"
            exit 0
          fi
          if [ "${{ matrix.connector }}" = "bloomberg_latest_apify" ] && [ -z "${APIFY_BLOOMBERG_DISCOVERY_ACTOR_ID:-}" ]; then
            printf '%s\n' '{"ok":true,"connector":"bloomberg_latest_apify","skipped":true,"reason":"APIFY_BLOOMBERG_DISCOVERY_ACTOR_ID is not configured for scheduled extraction."}' > "policy_extraction_summary_${{ matrix.connector }}.json"
            exit 0
          fi
          python run_connector_extraction_pipeline.py \
            --connector "${{ matrix.connector }}" \
            --selection new_or_updated \
            --limit "${{ matrix.extraction_limit }}" \
            --max-pages "${{ matrix.max_pages }}" \
            --include-pdfs true \
            --include-rss true \
            --require-remote-persistence \
            --summary-path "policy_extraction_summary_${{ matrix.connector }}.json"

      - name: Upload Extraction Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-extraction-summary-${{ matrix.connector }}-${{ github.run_id }}
          path: "policy_extraction_summary_${{ matrix.connector }}.json"
          if-no-files-found: ignore
