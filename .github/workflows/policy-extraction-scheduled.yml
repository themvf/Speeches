name: Policy Extraction (Scheduled)

on:
  schedule:
    # 10:00 UTC (6 AM ET) and 22:00 UTC (6 PM ET) — covers overnight + post-business-day output
    - cron: "0 10 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-document-pipeline
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Run connectors sequentially to avoid concurrent GCS writes to custom_documents.json.
      # fail-fast: false so one connector failing does not skip the others.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - connector: doj_usao_press_release
            extraction_limit: "25"
            max_pages: "5"
          - connector: finra_awc
            extraction_limit: "25"
            max_pages: "5"
          - connector: sec_enforcement_litigation
            extraction_limit: "25"
            max_pages: "5"
          - connector: sec_speech
            extraction_limit: "25"
            max_pages: "5"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ${{ matrix.connector }}
        run: |
          set -euo pipefail
          python run_connector_extraction_pipeline.py \
            --connector "${{ matrix.connector }}" \
            --selection new_or_updated \
            --limit "${{ matrix.extraction_limit }}" \
            --max-pages "${{ matrix.max_pages }}" \
            --include-pdfs true \
            --include-rss true \
            --require-remote-persistence \
            --summary-path "policy_extraction_summary_${{ matrix.connector }}.json"

      - name: Check for ${{ matrix.connector }} Changes
        id: extraction_summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          connector = "${{ matrix.connector }}"
          path = Path(f"policy_extraction_summary_{connector}.json")
          payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          changed_count = int(payload.get("saved_new", 0) or 0) + int(payload.get("saved_updates", 0) or 0)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed_count={changed_count}\n")
          print(f"{connector} new or updated documents: {changed_count}")
          PY

      - name: Enrich ${{ matrix.connector }}
        if: steps.extraction_summary.outputs.changed_count != '0'
        run: |
          set -euo pipefail
          python run_financial_news_pipeline.py enrich \
            --require-remote-persistence \
            --source-kind "${{ matrix.connector }}" \
            --mode only_missing_or_failed \
            --doc-ids-from-summary "policy_extraction_summary_${{ matrix.connector }}.json" \
            --model gpt-4o-mini \
            --summary-path "policy_enrich_summary_${{ matrix.connector }}.json"

      - name: Upload Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-extraction-summary-${{ matrix.connector }}-${{ github.run_id }}
          path: |
            policy_extraction_summary_${{ matrix.connector }}.json
            policy_enrich_summary_${{ matrix.connector }}.json
          if-no-files-found: ignore
