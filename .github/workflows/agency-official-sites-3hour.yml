name: Agency Official Site Extraction (3 Hour)

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      extraction_limit:
        description: "Max documents to extract per agency connector"
        required: false
        default: "25"
      max_pages:
        description: "Listing pages to scan per agency connector"
        required: false
        default: "3"
      enrich_limit:
        description: "Max documents to enrich per agency connector"
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: agency-official-sites-3hour
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - connector: cftc_press_release
            extraction_limit: "25"
            max_pages: "3"
            include_rss: "false"
          - connector: cftc_public_statement_remark
            extraction_limit: "25"
            max_pages: "3"
            include_rss: "false"
          - connector: federal_reserve_speech_testimony
            extraction_limit: "25"
            max_pages: "2"
            include_rss: "true"
          - connector: treasury_press_release
            extraction_limit: "25"
            max_pages: "3"
            include_rss: "false"
          - connector: treasury_statement_remark
            extraction_limit: "25"
            max_pages: "3"
            include_rss: "false"
          - connector: treasury_featured_story
            extraction_limit: "25"
            max_pages: "2"
            include_rss: "false"
          - connector: doj_usao_press_release
            extraction_limit: "25"
            max_pages: "2"
            include_rss: "true"
          - connector: cisa_cybersecurity_advisory
            extraction_limit: "30"
            max_pages: "2"
            include_rss: "true"

    env:
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      GCS_CREDENTIALS_JSON: ${{ secrets.GCS_CREDENTIALS_JSON }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
      RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
      EXTRACTION_LIMIT: ${{ github.event.inputs.extraction_limit || matrix.extraction_limit }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || matrix.max_pages }}
      ENRICH_LIMIT: ${{ github.event.inputs.enrich_limit || '20' }}
      ENRICH_MODEL: deepseek-v4-pro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract ${{ matrix.connector }}
        run: |
          set -euo pipefail
          python run_connector_extraction_pipeline.py \
            --connector "${{ matrix.connector }}" \
            --selection new_or_updated \
            --limit "${EXTRACTION_LIMIT}" \
            --max-pages "${MAX_PAGES}" \
            --include-pdfs false \
            --include-rss "${{ matrix.include_rss }}" \
            --require-remote-persistence \
            --summary-path "agency_official_${{ matrix.connector }}.json"

      - name: Enrich ${{ matrix.connector }} with DeepSeek
        run: |
          set -euo pipefail
          python run_financial_news_pipeline.py \
            enrich \
            --require-remote-persistence \
            --mode only_missing_or_failed \
            --order recent \
            --source-kind "${{ matrix.connector }}" \
            --limit "${ENRICH_LIMIT}" \
            --provider deepseek \
            --model "${ENRICH_MODEL}" \
            --checkpoint-every 5 \
            --summary-path "agency_official_enrichment_${{ matrix.connector }}.json"

      - name: Upload Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agency-official-${{ matrix.connector }}-${{ github.run_id }}
          path: |
            agency_official_${{ matrix.connector }}.json
            agency_official_enrichment_${{ matrix.connector }}.json
          if-no-files-found: ignore
